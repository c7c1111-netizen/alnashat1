[project]
name = "activity-plan-generator"
version = "1.0.0"
description = "منشئ خطة النشاط الطلابي — تعبئة قالب Word الأصلي آليًا"
requires-python = ">=3.11"
# اعتماديات التشغيل على Vercel فقط (بدون LibreOffice: تحويل PDF غير متاح هناك)
dependencies = [
  "flask>=3.0",
  "lxml>=5.0",
  "hijridate>=2.3",
  "openpyxl>=3.1",
  "pymupdf>=1.24",
  "uharfbuzz>=0.39",
]

[tool.vercel]
entrypoint = "server:app"
