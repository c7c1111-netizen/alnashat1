<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  إعداد الخطوط لتحويل PDF عبر LibreOffice.
  1) يُضاف مجلد fonts/ بالمشروع: ضع فيه خطوط Word الأصلية إن توفرت لديك
     (majalla.ttf / majallab.ttf / arial.ttf / arialbd.ttf / micross.ttf)
     وستُستخدم كما هي بدل البدائل.
  2) عند عدم توفرها تُستخدم أقرب البدائل قياسًا:
     Arial (لاتيني) ← Liberation Sans (مطابق القياس)
     الحروف العربية ← Noto Naskh Arabic UI (عرض وارتفاع سطر قريبان من Arial Arabic)
-->
<fontconfig>
  <dir>@FONTS_DIR@</dir>
  <cachedir>@CACHE_DIR@</cachedir>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <alias binding="same"><family>Arial</family><prefer><family>Arial</family><family>Liberation Sans</family><family>Plan Arabic Fallback</family><family>Noto Naskh Arabic UI</family></prefer></alias>
  <alias binding="same"><family>Sakkal Majalla</family><prefer><family>Sakkal Majalla</family><family>Plan Arabic Fallback</family><family>Noto Naskh Arabic UI</family></prefer></alias>
  <alias binding="same"><family>Times New Roman</family><prefer><family>Times New Roman</family><family>Liberation Serif</family><family>Plan Arabic Fallback</family><family>Noto Naskh Arabic UI</family></prefer></alias>
  <alias binding="same"><family>Microsoft Sans Serif</family><prefer><family>Microsoft Sans Serif</family><family>Liberation Sans</family><family>Plan Arabic Fallback</family><family>Noto Naskh Arabic UI</family></prefer></alias>
  <alias binding="same"><family>Calibri</family><prefer><family>Calibri</family><family>Carlito</family><family>Liberation Sans</family><family>Plan Arabic Fallback</family><family>Noto Naskh Arabic UI</family></prefer></alias>
  <alias binding="same"><family>Calibri Light</family><prefer><family>Calibri Light</family><family>Carlito</family><family>Liberation Sans</family><family>Plan Arabic Fallback</family><family>Noto Naskh Arabic UI</family></prefer></alias>
  <alias binding="same"><family>Verdana</family><prefer><family>Verdana</family><family>DejaVu Sans</family><family>Plan Arabic Fallback</family><family>Noto Naskh Arabic UI</family></prefer></alias>
  <alias binding="same"><family>Cambria</family><prefer><family>Cambria</family><family>Caladea</family><family>Liberation Serif</family></prefer></alias>
</fontconfig>
